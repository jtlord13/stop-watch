
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<title>Stopwatch</title>
<style>


    body {
        font-family: Arial, sans-serif;
        background-color: black;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
    }

    .stopwatch-box {
        background: black;
        border-radius: 12px;
        border-style: solid;
        border-color:white; 
        padding: 30px;
        width: 260px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    .display {
        font-size: 2.5em;
        margin-bottom: 20px;
        font-weight: bold;
        color:white;
    }

    li{
        list-style: none;
        font-size: 1em;
        margin: 5px 0;
        color:white;
    }
    button {
        padding: 10px 15px;
        margin: 5px;
        font-size: 1em;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    .start {
        background-color: #2ecc71;
        color: white;
    }

    .stop {
        background-color: #e74c3c;
        color: white;
    }

    .reset {
        background-color: #3498db;
        color: white;
    }

    button:hover {
        opacity: 0.85;
    }

    .solvedTimeHistory {
        font-size: 20px;
        text-align: center;
        font-family: "Roboto", sans-serif;
        font-weight: bold;
        color: #3498db;
}


    

    .milkshake{
        margin-top: 30px;
        background: black;
        border-radius: 12px;
        border-style:solid;
        border-color:white;
        padding: 20px;
        width: 260px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        text-align: center;
        display: flex;
        flex-direction: column;
        font-family: "Roboto", sans-serif;
        align-items: center;
    }

    .clear {
        background-color: #3498db;
        color: white;
        margin-top: 6px;
        margin-bottom:10px;
    }

    .average-button{
        background-color: #fd8700;
        color: white;
        
    }
   
    .average-time{
        text-align: center;
        font-family: "Roboto", sans-serif;
        font-weight: bold;
        font-size: 20px;
        margin-bottom: 6px;
        color:white ;
       
    }

    .average {
        font-size: 20px;
        text-align: center;
        font-family: "Roboto", sans-serif;
        font-weight: bold;
        color:orange;
    }

   h1 {
  font-family: sans-serif;
  font-size: 2em;
  text-transform: uppercase;
  /* Syncs color and glow at 1s total speed */
  animation: rainbow-glow 6s infinite step-end;
 
}

@keyframes rainbow-glow {
  0%   { color: red;  }
  20%  { color: green;  }
  40%  { color: yellow;  }
  60%  { color: rgb(0, 68, 255);  }
  80%  { color: orange;  }
}
 


  


</style>
</head>

<body>

<h1>The Greatest Cube Timer of All Time</h1>



<div class="stopwatch-box">
    <div id="display" class="display">{{ elapsedTimeSignal() }}</div>
    <button class="start" (click)="start()" (keyup)="start()">Start</button>
    <button class="stop" (click)="stop()" (keyup)="stop()">Stop</button>
    <button class="reset" (click)="resetTime()">Reset</button>
</div>

<div class="milkshake">
    <div class="solvedTimeHistory"> History 
        @for(solvedTime of solvedTimes; track $index) {
                <li>{{ solvedTime }}</li>
    } 
    </div>

    <button class="clear" (click)="clearHistory()">Clear</button>   

    <div class="average">Average Time</div>
    <div class="average-time">{{averageTime()}}</div>
    <button class="average-button" (click)="calculateAverage(solvedTimes)">Calculate Average </button>

    
</div>


    
</div>

</body>
</html>
